services:
  postgres:
    image: postgres:15-alpine
    container_name: ykmedia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ykmedia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ykmedia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ykmedia_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution:
    # 2.4.0-rc2 e a primeira versao em que os botoes interativos funcionam:
    # a v2.3.7 embrulhava a mensagem em viewOnceMessage (o WhatsApp descartava)
    # e nao injetava o node native_flow. Exige ativacao de licenca (gratuita).
    image: evoapicloud/evolution-api:2.4.0-rc2
    container_name: ykmedia_evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # A porta do host e escolhida no preparo: o Windows reserva faixas de
      # portas (WinNAT) e a faixa muda a cada reinicio, o que tornava a 8080
      # fixa um ponto unico de falha. Dentro do container segue sendo 8080.
      - "${EVOLUTION_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8080}

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution123@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: ykmedia

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: ykmedia
      CACHE_REDIS_SAVE_INSTANCES: "false"

      CONFIG_SESSION_PHONE_NAME: YkMedia
      CONFIG_SESSION_PHONE_CLIENT: YkMedia
      # Sem pin de WEB_VERSION: os botoes so renderizam com a versao do
      # WhatsApp Web que acompanha a imagem. Fixar uma antiga volta a quebrar.
      LANGUAGE: pt-BR
      TELEMETRY: "false"

    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - ykmedia_network

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  ykmedia_network:
    driver: bridge
