services:
  postgres:
    image: postgres:15-alpine
    container_name: ykmedia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ykmedia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ykmedia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ykmedia_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: ykmedia_evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:8080

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution123@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: ykmedia

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: ykmedia
      CACHE_REDIS_SAVE_INSTANCES: "false"

      CONFIG_SESSION_PHONE_NAME: YkMedia
      CONFIG_SESSION_PHONE_CLIENT: YkMedia
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1043944461
      WEB_VERSION: 2.3000.1043944461
      LANGUAGE: pt-BR
      TELEMETRY: "false"

    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - ykmedia_network

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  ykmedia_network:
    driver: bridge
