[package]
name = "ykmedia"
version = "0.3.2"
description = "YkMedia desktop"
authors = ["YkMedia"]
edition = "2021"

[lib]
name = "ykmedia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
